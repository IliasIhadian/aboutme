version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - yarn install
    build:
      commands:
        - echo "REACT_APP_GMAIL_APP_USER=$GMAIL_APP_USER" >> .env
        - echo "REACT_APP_GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" >> .env
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
